spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:hotels-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  demo:
    seed-enabled: false
  jwt:
    secret: test-secret-test-secret-test-secret-123456
  rooms:
    lock-ttl: 10m
