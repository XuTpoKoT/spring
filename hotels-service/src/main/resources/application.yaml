server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: hotels-service
  datasource:
    url: "${DB_URL:jdbc:h2:mem:hotels;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /openapi.yml

app:
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-me-super-secret-key-at-least-32-bytes}
  rooms:
    lock-ttl: ${ROOM_LOCK_TTL:10m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
