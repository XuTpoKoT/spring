openapi: 3.0.3
info:
  title: Hotels Service API (internal)
  version: 1.0.0
  description: |
    Внутренний контракт hotels-service.

    Пути указаны так, как их видит сам сервис, без префикса API Gateway.
    Сервис является OAuth2 Resource Server: JWT из заголовка `Authorization`
    проверяется внутри сервиса. API Gateway только маршрутизирует запросы
    и не выполняет аутентификацию/авторизацию.

    Операции с расширением `x-internal: true` доступны только внутри контура
    и не публикуются через API Gateway.
servers:
  - url: /
    description: Текущий origin (Swagger UI, Gateway или прямой вызов)

tags:
  - name: Hotels
    description: Работа с отелями
  - name: Rooms
    description: Работа с номерами
  - name: Admin
    description: Административные операции
  - name: Internal
    description: Межсервисные операции, не публикуются через Gateway

security:
  - bearerAuth: []

paths:
  /hotels:
    get:
      tags: [Hotels]
      operationId: listHotels
      summary: Получить список отелей
      description: Доступно ролям USER и ADMIN.
      responses:
        '200':
          description: Список отелей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hotel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms:
    get:
      tags: [Rooms]
      operationId: listAvailableRooms
      summary: Получить список всех свободных номеров
      description: |
        Возвращает свободные номера без специальной сортировки.
        Доступно ролям USER и ADMIN.
        - name: hotelId
          in: query
          required: false
          description: Ограничить выборку одним отелем
          schema:
            type: integer
            format: int64
        - name: startDate
          in: query
          required: false
          description: Начало периода. Передаётся вместе с endDate.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Конец периода. Передаётся вместе с startDate.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Свободные номера
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/recommend:
    get:
      tags: [Rooms]
      operationId: recommendRooms
      summary: Получить список рекомендованных номеров
      description: |
        Те же свободные номера, что и в `GET /rooms`, но отсортированные
        по возрастанию `timesBooked`: сначала менее популярные.
        Доступно ролям USER и ADMIN.
        - name: hotelId
          in: query
          required: false
          description: Ограничить выборку одним отелем
          schema:
            type: integer
            format: int64
        - name: startDate
          in: query
          required: false
          description: Начало периода. Передаётся вместе с endDate.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Конец периода. Передаётся вместе с startDate.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Рекомендованные номера
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/hotels:
    post:
      tags: [Admin]
      operationId: createHotel
      summary: Добавить отель
      description: Доступно только роли ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
      responses:
        '201':
          description: Отель создан
          headers:
            Location:
              description: URL созданного отеля
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Отель с такими данными уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/rooms:
    post:
      tags: [Admin]
      operationId: createRoom
      summary: Добавить номер в отель
      description: Доступно только роли ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: Номер создан
          headers:
            Location:
              description: URL созданного номера
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Отель с указанным hotelId не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Номер с таким number уже существует в отеле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/{id}/confirm-availability:
    post:
      tags: [Internal]
      x-internal: true
      operationId: confirmRoomAvailability
      summary: Подтвердить доступность номера
      description: |
        Временно блокирует слот номера `id` на период `startDate`–`endDate`.
        Вызывается booking-service в рамках саги создания бронирования.
        Маршрут не публикуется через API Gateway.
      parameters:
        - name: id
          in: path
          required: true
          description: ID номера
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      responses:
        '200':
          description: Слот успешно заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Номер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Номер недоступен на запрошенный период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/{id}/release:
    post:
      tags: [Internal]
      x-internal: true
      operationId: releaseRoom
      summary: Снять временную блокировку номера
      description: |
        Компенсирующее действие: снимает ранее созданную блокировку слота.
        Идемпотентно: повторный вызов для уже снятой блокировки также
        завершается успешно. Маршрут не публикуется через API Gateway.
      parameters:
        - name: id
          in: path
          required: true
          description: ID номера
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '204':
          description: Блокировка снята
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Номер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Hotel:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Grand Hotel
        address:
          type: string
          example: Москва, Тверская ул., 1

    HotelInput:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Grand Hotel
        address:
          type: string
          minLength: 1
          maxLength: 512
          example: Москва, Тверская ул., 1

    Room:
      type: object
      required: [id, hotelId, number, available, timesBooked]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        hotelId:
          type: integer
          format: int64
          example: 1
        number:
          type: string
          example: '101'
        available:
          type: boolean
          example: true
        timesBooked:
          type: integer
          format: int32
          minimum: 0
          example: 3

    RoomInput:
      type: object
      required: [hotelId, number]
      properties:
        hotelId:
          type: integer
          format: int64
          example: 1
        number:
          type: string
          minLength: 1
          maxLength: 32
          example: '101'
        available:
          type: boolean
          default: true
          description: Начальное состояние номера

    AvailabilityRequest:
      type: object
      required: [bookingId, startDate, endDate]
      properties:
        bookingId:
          type: integer
          format: int64
          example: 100
        startDate:
          type: string
          format: date
          example: '2026-11-10'
        endDate:
          type: string
          format: date
          example: '2026-11-12'
      description: Значение endDate должно быть больше startDate.

    AvailabilityConfirmation:
      type: object
      required: [roomId, bookingId, confirmed, startDate, endDate, lockExpiresAt]
      properties:
        roomId:
          type: integer
          format: int64
          example: 10
        bookingId:
          type: integer
          format: int64
          example: 100
        confirmed:
          type: boolean
          example: true
        startDate:
          type: string
          format: date
          example: '2026-11-10'
        endDate:
          type: string
          format: date
          example: '2026-11-12'
        lockExpiresAt:
          type: string
          format: date-time
          description: Момент автоматического снятия временной блокировки
          example: '2026-11-08T12:30:00Z'

    ReleaseRequest:
      type: object
      required: [bookingId]
      properties:
        bookingId:
          type: integer
          format: int64
          example: 100

    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-11-08T12:00:00Z'
        status:
          type: integer
          format: int32
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: Room 10 is not available for the requested period
        path:
          type: string
          example: /rooms/10/confirm-availability

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Не аутентифицирован или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
