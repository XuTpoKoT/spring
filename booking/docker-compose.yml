services:
  postgres:
    image: postgres:15-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: booking-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking
      DB_USERNAME: booking_user
      DB_PASSWORD: booking_pass
      JWT_SECRET: mySecretKeyForJWTShouldBeLongEnoughAndSecureInProduction
      HOTELS_BASE_URL: http://hotels-service:8081

volumes:
  postgres_data:
