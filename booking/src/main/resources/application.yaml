spring:
  application:
    name: booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USERNAME:booking_user}
    password: ${DB_PASSWORD:booking_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-super-secret-key-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: ${JWT_ISSUER:booking-service}
  hotels:
    base-url: ${HOTELS_BASE_URL:http://localhost:8081}
    connect-timeout: ${HOTELS_CONNECT_TIMEOUT:2s}
    read-timeout: ${HOTELS_READ_TIMEOUT:5s}
    max-attempts: ${HOTELS_MAX_ATTEMPTS:3}
    initial-backoff: ${HOTELS_INITIAL_BACKOFF:200ms}
    backoff-multiplier: ${HOTELS_BACKOFF_MULTIPLIER:2.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
