spring:
  application:
    name: booking
  datasource:
    url: "${DB_URL:jdbc:h2:mem:booking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-me-super-secret-key-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: ${JWT_ISSUER:booking-service}
  hotels:
    base-url: ${HOTELS_BASE_URL:http://localhost:8081}
    connect-timeout: ${HOTELS_CONNECT_TIMEOUT:2s}
    read-timeout: ${HOTELS_READ_TIMEOUT:5s}
    max-attempts: ${HOTELS_MAX_ATTEMPTS:3}
    initial-backoff: ${HOTELS_INITIAL_BACKOFF:200ms}
    backoff-multiplier: ${HOTELS_BACKOFF_MULTIPLIER:2.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
