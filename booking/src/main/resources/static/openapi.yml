openapi: 3.0.3
info:
  title: Booking Service API (internal)
  version: 1.0.0
  description: |
    Внутренний контракт booking-service.

    Пути указаны так, как их видит сам сервис, без префикса API Gateway.
    Сервис является OAuth2 Resource Server: JWT из заголовка `Authorization`
    проверяется внутри сервиса. API Gateway только маршрутизирует запросы
    и не выполняет аутентификацию/авторизацию.

    При создании бронирования сервис синхронно вызывает hotels-service:
    `POST /rooms/{id}/confirm-availability`, а при сбое выполняет компенсацию
    `POST /rooms/{id}/release`.
servers:
  - url: /
    description: Текущий origin (Swagger UI, Gateway или прямой вызов)

tags:
  - name: Auth
    description: Регистрация и аутентификация
  - name: Bookings
    description: Бронирования пользователя
  - name: Admin
    description: Административные операции

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [Auth]
      operationId: register
      summary: Зарегистрировать пользователя
      description: Создаёт пользователя и сразу возвращает JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Пользователь с таким username уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth:
    post:
      tags: [Auth]
      operationId: authenticate
      summary: Авторизовать пользователя
      description: Проверяет учётные данные и возвращает JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Аутентификация успешна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный username или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Создать бронирование
      description: |
        Пользователь создаёт бронирование с выбором номера или автоподбором.
        При `autoSelect: true` поле `roomId` игнорируется.
        Бронирование создаётся в статусе PENDING, затем booking-service
        подтверждает доступность в hotels-service. При успехе статус меняется
        на CONFIRMED, при сбое выполняется компенсация и статус CANCELLED.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '201':
          description: Бронирование создано
          headers:
            Location:
              description: URL созданного бронирования
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Номер или отель не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Нет доступного номера на запрошенный период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: hotels-service недоступен после исчерпания повторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Bookings]
      operationId: listUserBookings
      summary: История бронирований пользователя
      description: Возвращает бронирования текущего пользователя.
      responses:
        '200':
          description: Список бронирований
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/bookings:
    post:
      tags: [Admin]
      operationId: createBookingForUser
      summary: Забронировать номер для пользователя
      description: |
        Администратор создаёт бронирование от имени пользователя.
        При `autoSelect: true` поле `roomId` игнорируется.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingCreateRequest'
      responses:
        '201':
          description: Бронирование создано
          headers:
            Location:
              description: URL созданного бронирования
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Пользователь, номер или отель не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Нет доступного номера на запрошенный период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: hotels-service недоступен после исчерпания повторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/bookings/{id}:
    delete:
      tags: [Admin]
      operationId: cancelBookingAsAdmin
      summary: Отменить бронирование (ADMIN)
      description: |
        Администратор отменяет бронирование любого пользователя и снимает
        блокировку номера в hotels-service. Доступно только роли ADMIN.
      parameters:
        - name: id
          in: path
          required: true
          description: ID бронирования
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Бронирование отменено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Бронирование не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Бронирование уже отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /booking/{id}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Получить бронирование по id
      description: |
        Доступно владельцу бронирования и администратору.
        Чужое бронирование для роли USER возвращает 403.
      parameters:
        - name: id
          in: path
          required: true
          description: ID бронирования
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Бронирование
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Бронирование не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Отменить бронирование
      description: |
        Отменяет бронирование текущего пользователя и снимает блокировку
        номера в hotels-service. Доступно только роли USER.
      parameters:
        - name: id
          in: path
          required: true
          description: ID бронирования
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Бронирование отменено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Бронирование не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Бронирование уже отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Корреляционный идентификатор запроса. Повторный запрос с тем же
        значением не создаёт новое бронирование, а возвращает ранее созданное.
      schema:
        type: string
        maxLength: 64

  schemas:
    Booking:
      type: object
      required: [id, userId, roomId, startDate, endDate, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 100
        userId:
          type: integer
          format: int64
          example: 7
        roomId:
          type: integer
          format: int64
          example: 10
        startDate:
          type: string
          format: date
          example: '2026-11-10'
        endDate:
          type: string
          format: date
          example: '2026-11-12'
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
          example: CONFIRMED
        createdAt:
          type: string
          format: date-time
          example: '2026-11-08T12:00:00Z'

    BookingCreateRequest:
      type: object
      required: [autoSelect, startDate, endDate]
      properties:
        roomId:
          type: integer
          format: int64
          description: ID номера. Игнорируется при autoSelect=true.
          example: 10
        autoSelect:
          type: boolean
          default: false
          description: Если true, номер подбирается автоматически.
          example: false
        startDate:
          type: string
          format: date
          example: '2026-11-10'
        endDate:
          type: string
          format: date
          example: '2026-11-12'
      description: |
        roomId обязателен при autoSelect=false. При autoSelect=true номер
        подбирается автоматически. Значение endDate должно быть больше startDate.

    AdminBookingCreateRequest:
      type: object
      required: [username, autoSelect, startDate, endDate]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: Пользователь, для которого создаётся бронирование
          example: john
        roomId:
          type: integer
          format: int64
          description: ID номера. Игнорируется при autoSelect=true.
          example: 10
        autoSelect:
          type: boolean
          default: false
          description: Если true, номер подбирается автоматически.
          example: false
        startDate:
          type: string
          format: date
          example: '2026-11-10'
        endDate:
          type: string
          format: date
          example: '2026-11-12'
      description: |
        roomId обязателен при autoSelect=false. При autoSelect=true номер
        подбирается автоматически. Значение endDate должно быть больше startDate.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          example: john
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: secret123

    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: john
        password:
          type: string
          format: password
          example: secret123

    AuthResponse:
      type: object
      required: [token, tokenType, expiresIn, userId, username, role]
      properties:
        token:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Время жизни токена в секундах
          example: 3600
        userId:
          type: integer
          format: int64
          example: 7
        username:
          type: string
          example: john
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER

    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-11-08T12:00:00Z'
        status:
          type: integer
          format: int32
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: No available room for the requested period
        path:
          type: string
          example: /bookings

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Не аутентифицирован или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
